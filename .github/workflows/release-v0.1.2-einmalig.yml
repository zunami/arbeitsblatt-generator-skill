name: Einmaliger genehmigter Release v0.1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.2-einmalig.yml'

permissions:
  contents: write

concurrency:
  group: release-v0.1.2-einmalig
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'zunami/arbeitsblatt-generator-skill' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Get approved source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate approved release and package
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '0.1.2'
          test "$(cat arbeitsblatt-generator/VERSION)" = '0.1.2'
          test -s RELEASE_NOTES_v0.1.2.md
          if gh release view v0.1.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::Release v0.1.2 already exists, refusing to replace.'
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.2" >/dev/null 2>&1; then
            echo '::error::Tag v0.1.2 already exists, refusing to alter.'
            exit 1
          fi
          python tools/paket_bauen.py
          cmp -s dist/v0.1.2/skill.zip skill.zip
          (cd dist/v0.1.2 && sha256sum --check SHA256SUMS)
          test "$(sha256sum skill.zip | cut -d ' ' -f 1)" = '7db22165e8eb0013884572036984cdb81ae019b1618496c66b8f4be3c18030e2'
      - name: Publish v0.1.2 once and verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.1.2 dist/v0.1.2/skill.zip dist/v0.1.2/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Version 0.1.2' \
            --notes-file RELEASE_NOTES_v0.1.2.md \
            --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.2" > release-check.json
          jq -e '.name == "Version 0.1.2" and .draft == false and .prerelease == false and
            ([.assets[].name] | sort) == ["SHA256SUMS", "skill.zip"] and
            ([.assets[] | select(.name == "skill.zip") | .digest] | first) ==
            "sha256:7db22165e8eb0013884572036984cdb81ae019b1618496c66b8f4be3c18030e2"' release-check.json >/dev/null
          jq -r '.body' release-check.json > release-body-check.md
          cmp -s RELEASE_NOTES_v0.1.2.md release-body-check.md
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = 'v0.1.2'
          echo 'Release v0.1.2 verified as Latest.'
