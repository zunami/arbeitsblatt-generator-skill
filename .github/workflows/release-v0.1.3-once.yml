name: Einmaliger Release v0.1.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.3-once.yml'

permissions:
  contents: write

concurrency:
  group: release-v0.1.3
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'zunami/arbeitsblatt-generator-skill' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: '0.1.3'
      SOURCE_SHA: '8c6d7e98324d289542fc324cfca05f7538fd6620'
      EXPECTED_SHA256: '87ca401a0d58e517045af790f7ed6780a69491fe9ed681e23fdc130cb3233119'
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Freigegebenen Quellstand laden
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Testabhaengigkeit installieren
        run: python -m pip install reportlab

      - name: Version und Paket pruefen
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "$VERSION"
          test "$(cat arbeitsblatt-generator/VERSION)" = "$VERSION"
          test -s "RELEASE_NOTES_v${VERSION}.md"
          python tools/paket_bauen.py
          cmp "dist/v${VERSION}/skill.zip" skill.zip
          echo "${EXPECTED_SHA256}  skill.zip" | sha256sum -c -
          (cd "dist/v${VERSION}" && sha256sum -c SHA256SUMS)

      - name: Vorhandene Version schuetzen
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release existiert bereits"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag existiert bereits"
            exit 1
          fi

      - name: Regulären Release publizieren
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            "dist/v${VERSION}/skill.zip" \
            "dist/v${VERSION}/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Version ${VERSION}" \
            --notes-file "RELEASE_NOTES_v${VERSION}.md" \
            --latest

      - name: Release nachpruefen
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v${VERSION}" > release.json
          jq -e \
            --arg title "Version ${VERSION}" \
            --arg sha "sha256:${EXPECTED_SHA256}" '
              .name == $title and
              .draft == false and
              .prerelease == false and
              ([.assets[].name] | sort) == ["SHA256SUMS", "skill.zip"] and
              ([.assets[] | select(.name == "skill.zip") | .digest] | first) == $sha
            ' release.json
          jq -r '.body' release.json > release-body-check.md
          cmp "RELEASE_NOTES_v${VERSION}.md" release-body-check.md
